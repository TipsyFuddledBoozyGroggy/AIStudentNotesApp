name: CI
# Authored 2026-11-01. NEVER RUN ON GITHUB as of this writing (no run record exists; RELEASE_GATES G5 stays NOT_RUN
# until one does). See docs/ops/ci-matrix.md for the job table, local equivalents and known limits.
#
# Action pins: every `uses:` is a full commit SHA with the tag in the trailing comment. The SHAs were verified on
# 2026-10-31 per docs/security/action-pin-verification.md (includes Trivy v0.35.0 and CodeQL v3.28.3); they have
# still not been exercised by a GitHub run. CodeQL v3 is slated for deprecation in Dec 2026; the v4 move is a
# follow-up (see docs/ops/ci-matrix.md). Dependabot (.github/dependabot.yml, ecosystem github-actions) proposes bumps.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; a job that needs more declares it itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  DOTNET_VERSION: "10.0.x"        # src/api/global.json pins 10.0.403 with rollForward latestFeature
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # Throwaway CI database from docker-compose.yml (dev-only credentials, not secrets).
  CI_DB_CONN: "Host=127.0.0.1;Port=5432;Database=college_companion_dev;Username=cc_dev;Password=cc_dev_only_password"

jobs:
  # Area filters. Docs-only changes (docs/**, *.md, .claude/**) skip the heavy jobs. Skipped jobs report as successful,
  # so they still satisfy a required status check. gitleaks and the dependency audit always run. No third-party
  # action: plain git diff and a shell `case`.
  #   backend: src/api/**, src/shared/contracts/**, docker-compose*.yml, global.json, Directory.* files
  #   web:     src/web/**, src/shared/contracts/**
  #   e2e:     backend OR web (a contract/API change can break the UI and vice versa)
  #   code:    backend OR web (used by the PR-only supply-chain jobs)
  # Anything that could change CI itself (ci.yml, .gitleaks.toml, any other .github/ file), any executable script
  # (SBR-04) and any path this list does not know runs EVERYTHING. When unsure, run it.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.f.outputs.code }}
      backend: ${{ steps.f.outputs.backend }}
      web: ${{ steps.f.outputs.web }}
      e2e: ${{ steps.f.outputs.e2e }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          base=""
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; fi
          # Pushes to main always run everything (no diff filter): GitHub keeps only one queued run per branch, so a
          # newer docs-only push can replace the queued run of the previous code push, and a diff against the previous
          # commit would then skip the code that never ran. The diff filter is for pull requests only.
          emit() {
            echo "backend=$1" >> "$GITHUB_OUTPUT"; echo "web=$2" >> "$GITHUB_OUTPUT"
            if [ "$1" = true ] || [ "$2" = true ]; then
              echo "code=true" >> "$GITHUB_OUTPUT"; echo "e2e=true" >> "$GITHUB_OUTPUT"
            else
              echo "code=false" >> "$GITHUB_OUTPUT"; echo "e2e=false" >> "$GITHUB_OUTPUT"
            fi
            echo "Result: backend=$1 web=$2"
          }
          if [ -z "$base" ] || ! git fetch --no-tags --depth=1 origin "$base" 2>/dev/null; then
            echo "No usable base commit: running everything."; emit true true; exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"; echo "$changed"
          backend=false; web=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              # CI configuration itself, and SBR-04: executable gates are never documentation, wherever they live.
              # docs/ops/ holds the DB log canary script that the api and e2e jobs run.
              .github/*|.gitleaks.toml|docs/ops/*|*.sh|*.bash|*.ps1|*.cmd|*.bat) backend=true; web=true ;;
              # Documentation only.
              docs/*|.claude/*|*.md) ;;
              # Shared contracts feed both sides.
              src/shared/contracts/*) backend=true; web=true ;;
              src/api/*|docker-compose*.yml|global.json|Directory.*|*/global.json|*/Directory.*) backend=true ;;
              src/web/*) web=true ;;
              # Unknown path: be conservative.
              *) echo "Unclassified path ($f): running everything."; backend=true; web=true ;;
            esac
          done <<< "$changed"
          if [ "$backend" = false ] && [ "$web" = false ]; then echo "Docs-only change: heavy jobs skipped."; fi
          emit "$backend" "$web"

  web:
    name: web (tsc, eslint, copy and skin lint, vitest, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Install (npm ci)
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      # Explicit named gate. These files are also part of the full vitest run below; running them first gives a
      # separate, named failure for wording and design-token rules (banned words, skin blocks hold no layout
      # properties, accent-usage ratchet, theme copy).
      - name: Copy and skin lint gate
        run: >-
          npx vitest run
          src/components/lecture/copy.test.ts
          src/components/syllabus/copy.test.ts
          src/lib/design/skinBlocks.test.ts
          src/components/ThemePicker.test.tsx
      - name: Unit tests (vitest)
        run: npm test
      - name: Production build (next build)
        run: npm run build

  api:
    name: api (build with warnings as errors, unit and integration tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/api
    env:
      ConnectionStrings__Default: "Host=127.0.0.1;Port=5432;Database=college_companion_dev;Username=cc_dev;Password=cc_dev_only_password"   # compose dev-only default
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25  # v4.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Cache policy (SBR-01): every run RESTORES; only a push to main SAVES, so a pull request (untrusted code) can
      # never write a cache that main or another run restores. No NuGet lock file exists in the repo
      # (RestorePackagesWithLockFile is off), so the key hashes the files that pin versions: csproj, props, global.json.
      - id: nuget
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/api/**/*.csproj', 'src/api/Directory.Build.props', 'src/api/global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      # The repo's compose file, so the tests run against the HARDENED Postgres (SB-01 log settings), exactly as
      # developers do. The integration tests create and drop their own cc_test_* databases and need no dev API.
      - name: Start Postgres (docker compose, hardened logging)
        working-directory: .
        run: docker compose up -d --wait postgres
      - name: Restore
        run: dotnet restore
      - name: Save NuGet cache (push to main only)
        if: ${{ github.event_name == 'push' && steps.nuget.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/api/**/*.csproj', 'src/api/Directory.Build.props', 'src/api/global.json') }}
      # Directory.Build.props already sets TreatWarningsAsErrors=true (0 warnings today); repeated here so the gate
      # survives someone editing the props file.
      - name: Build (Release, warnings as errors)
        run: dotnet build --no-restore -c Release -warnaserror
      - name: Test (unit, contract, architecture, AI, syllabus, integration)
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory "$RUNNER_TEMP/trx"
      # SB-01: after the tests ran, scan the DB server log. Passive = any CANARY marker the suites wrote;
      # active = a fresh CHECK violation carrying a canary. See docs/ops/db-log-canary.sh.
      - name: DB log canary (SB-01)
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          bash docs/ops/db-log-canary.sh cc-postgres-dev --passive
          bash docs/ops/db-log-canary.sh cc-postgres-dev
      - name: Upload test results and DB log (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: api-test-results
          path: ${{ runner.temp }}/trx
          retention-days: 7
          if-no-files-found: ignore

  # Harness e2e needs no API, no login and no microphone (synthetic fixtures). Own job so its `next dev` on :3100
  # never runs beside the real-stack job's server in the same directory.
  e2e-harness:
    name: e2e harness (Playwright, no API)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pwcache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ hashFiles('src/web/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-
      - name: Install Chromium (browser cached; OS libraries always installed)
        run: npx playwright install --with-deps chromium
      - name: Save Playwright browser cache (push to main only)
        if: ${{ github.event_name == 'push' && steps.pwcache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ hashFiles('src/web/package-lock.json') }}
      - name: Harness e2e (serial)
        run: npx playwright test -c playwright.harness.config.ts --workers=1
      - name: Upload Playwright output (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: e2e-harness-output
          path: |
            src/web/test-results
            src/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # Real stack, sharded. Each matrix entry is its own runner (own IP, own Docker network, own hardened Postgres, own
  # API on :5080, own `npm run dev:real` on :3000), so the dev-login limit and the shared dev users are per shard and
  # no spec can see another shard's data. Inside a shard everything is still SERIAL (--workers=1, one process per
  # screens spec). The API gets the same relaxed dev-only limits docker-compose.dev.yml uses.
  #   flows-a:   e2e/courses, syllabus, syllabus-utc, syllabus-unclaimed (reuse config; global setup creates only its users)
  #   flows-b:   e2e/lecture, notes, reopen, stop-move        (reuse config)
  #   screens-a: e2e-screens/screens, skins                   (screens config; each spec logs in its own user)
  #   screens-b: e2e-screens/geometry, gamer-glass, lecture-looks
  # Every spec file under e2e/ and e2e-screens/ must be named in exactly one shard (checked by the first step).
  # `users` lists the e2e/users.ts keys a shard's specs call stateFor() with; global-setup logs in only those.
  e2e-real:
    name: e2e real stack (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: flows-a
            reuse_specs: "e2e/courses.spec.ts e2e/syllabus.spec.ts e2e/syllabus-utc.spec.ts e2e/syllabus-unclaimed.spec.ts"
            users: "alice,bob,empty,signout,lostSession,keyboard,reload,axe,axeEmpty,sylMain,sylOther,sylHostile,sylUpload,sylUtc"
            screens_specs: ""
          - shard: flows-b
            reuse_specs: "e2e/lecture.spec.ts e2e/notes.spec.ts e2e/reopen.spec.ts e2e/stop-move.spec.ts"
            users: "alice,bob,notes,reopen,stopmove"
            screens_specs: ""
          - shard: screens-a
            reuse_specs: ""
            users: ""
            screens_specs: "screens.spec.ts skins.spec.ts"
          - shard: screens-b
            reuse_specs: ""
            users: ""
            screens_specs: "geometry.spec.ts gamer-glass.spec.ts lecture-looks.spec.ts"
    defaults:
      run:
        working-directory: src/web
    env:
      API_PROXY_TARGET: http://localhost:5080
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      # Coverage guard: a spec added later but not listed in any shard would silently never run in CI.
      - name: Every spec file belongs to exactly one shard
        working-directory: .
        run: |
          set -eu
          # Spec lists of ALL shards, read from this workflow file (not just this matrix entry).
          listed="$(grep -oE '(reuse_specs|screens_specs): "[^"]+"' .github/workflows/ci.yml | sed -E 's/^[a-z_]+: "//; s/"$//' | tr ' ' '\n' | sed '/^$/d')"
          bad=0
          for f in src/web/e2e/*.spec.ts; do
            b="e2e/$(basename "$f")"
            n="$(echo "$listed" | grep -cxF "$b" || true)"
            if [ "$n" -ne 1 ]; then echo "::error::$b is listed in $n shards (must be exactly 1)"; bad=1; fi
          done
          for f in src/web/e2e-screens/*.spec.ts; do
            b="$(basename "$f")"
            n="$(echo "$listed" | grep -cxF "$b" || true)"
            if [ "$n" -ne 1 ]; then echo "::error::e2e-screens/$b is listed in $n shards (must be exactly 1)"; bad=1; fi
          done
          exit "$bad"
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25  # v4.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Cache policy (SBR-01): restore on every run, save only on a push to main (see the api job).
      - id: nuget
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/api/**/*.csproj', 'src/api/Directory.Build.props', 'src/api/global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: npm ci
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pwcache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ hashFiles('src/web/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-
      - name: Install Chromium (browser cached; OS libraries always installed)
        run: npx playwright install --with-deps chromium
      - name: Save Playwright browser cache (push to main only)
        if: ${{ github.event_name == 'push' && steps.pwcache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ hashFiles('src/web/package-lock.json') }}
      - name: Start Postgres (docker compose, hardened logging)
        working-directory: .
        run: docker compose up -d --wait postgres
      # The web server only proxies to the API (no startup dependency), so start it first and let it boot while the
      # API compiles. Readiness of both is checked before any test runs.
      - name: Start the web app against the real API (npm run dev:real, port 3000)
        run: nohup npm run dev:real > "$RUNNER_TEMP/web.log" 2>&1 &
      - name: Build and start the API (Development env, port 5080)
        working-directory: .
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Default: ${{ env.CI_DB_CONN }}
          Security__AllowedOrigins__0: "http://localhost:3000"
          RateLimiting__AuthPermitPerMinute: "1000"
          RateLimiting__AudioTicketPermitPerMinute: "600"
          RateLimiting__WritePermitPerMinute: "300"
          RateLimiting__ApiPermitPerMinute: "1200"
        run: |
          dotnet build src/api/src/Tether.Host -c Release
          nohup dotnet run --project src/api/src/Tether.Host -c Release --no-build --no-launch-profile --urls http://127.0.0.1:5080 > "$RUNNER_TEMP/api.log" 2>&1 &
          curl -fsS --retry 60 --retry-delay 2 --retry-connrefused http://127.0.0.1:5080/health/live
      - name: Save NuGet cache (push to main only)
        if: ${{ github.event_name == 'push' && steps.nuget.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/api/**/*.csproj', 'src/api/Directory.Build.props', 'src/api/global.json') }}
      - name: Wait for the web app
        run: curl -fsS --retry 60 --retry-delay 3 --retry-connrefused --max-time 120 http://localhost:3000/signin > /dev/null
      # Reuse configs: they attach to the servers started above instead of starting second ones.
      - name: Real-stack e2e (${{ matrix.shard }}; serial)
        if: ${{ matrix.reuse_specs != '' }}
        env:
          E2E_USERS: ${{ matrix.users }}
          REUSE_SPECS: ${{ matrix.reuse_specs }}
        run: |
          read -r -a specs <<< "$REUSE_SPECS"
          npx playwright test -c playwright.reuse.config.ts --workers=1 "${specs[@]}"
      # One Playwright process per screens spec, as before; a failure in one does not stop the next.
      - name: Screens specs (${{ matrix.shard }}; serial, one process per spec)
        if: ${{ !cancelled() && matrix.screens_specs != '' }}
        env:
          SCREENS_SPECS: ${{ matrix.screens_specs }}
        run: |
          rc=0
          read -r -a specs <<< "$SCREENS_SPECS"
          for spec in "${specs[@]}"; do
            echo "::group::e2e-screens/$spec"
            npx playwright test -c playwright.screens.config.ts "e2e-screens/$spec" --workers=1 || rc=1
            echo "::endgroup::"
          done
          exit "$rc"
      - name: DB log canary (SB-01)
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          bash docs/ops/db-log-canary.sh cc-postgres-dev --passive
          bash docs/ops/db-log-canary.sh cc-postgres-dev
      - name: Upload Playwright output, axe reports and server logs (on failure)
        if: ${{ failure() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: e2e-real-output-${{ matrix.shard }}
          path: |
            src/web/test-results
            src/web/playwright-report
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log
          retention-days: 7
          if-no-files-found: ignore

  secret-scan:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0   # full history (SEC-019)
          persist-credentials: false
      - name: gitleaks
        run: |
          # SBR-03: the tarball must match the SHA-256 pinned here. The hash was copied from the release's own
          # gitleaks_8.21.2_checksums.txt on 2026-10-31 (trust on first use: same origin as the asset, so it catches a
          # later replaced asset, not a release that was bad when pinned). Bumping the version means bumping both.
          set -euo pipefail
          VER=8.21.2
          SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba   # gitleaks_8.21.2_linux_x64.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          # .gitleaks.toml holds narrowly scoped test/fixture allowlists (generic-api-key only); all default rules stay on.
          "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact --verbose

  # Always runs (no path filter): a new advisory can appear without any code change, and a backend-only or web-only
  # change must not skip the other ecosystem's audit. The npm audit steps moved here from the web job; they need only
  # package-lock.json, not node_modules.
  dependency-audit:
    name: dependency audit (.NET and npm)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25  # v4.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit, production dependencies (any severity fails)
        working-directory: src/web
        run: npm audit --omit=dev --audit-level=low
      - name: npm audit, all dependencies (high and critical fail; moderate dev-only findings allowed explicitly)
        working-directory: src/web
        run: |
          # KNOWN AND ACCEPTED (2026-10-31): 14 moderate findings, all dev-only, all via the `minimatch` chain under
          # eslint / typescript-eslint plugins. They are not in the shipped bundle (the production audit above is
          # clean). This step still FAILS on any high or critical finding, and on any moderate count above 14, so a
          # new moderate finding is a deliberate decision, not silence. Lower the number when the chain is fixed.
          npm audit --audit-level=high
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          node -e '
            const m = require(process.argv[1]).metadata.vulnerabilities;
            console.log("audit counts", JSON.stringify(m));
            if (m.moderate > 14 || m.low > 0) { console.error("New low/moderate findings beyond the 14 accepted dev-only minimatch ones"); process.exit(1); }
          ' "$RUNNER_TEMP/audit.json"
      - name: dotnet list package --vulnerable (High or Critical fails)
        working-directory: src/api
        # SBR-02: explicit bash (-eo pipefail) and explicit exit handling. The gate must fail when the check itself
        # cannot run, not only when it finds a High/Critical row.
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore
          rc=0
          dotnet list package --vulnerable --include-transitive > audit.txt 2>&1 || rc=$?
          cat audit.txt
          if [ "$rc" -ne 0 ]; then echo "::error::dotnet list package exited $rc: the vulnerability check did not complete"; exit 1; fi
          # NU1900 = the vulnerability feed could not be read; "Unable to load" = a feed was unreachable.
          if grep -qE "NU1900|Unable to load the service index|error (NU|MSB)[0-9]+" audit.txt; then
            echo "::error::the vulnerability data could not be retrieved or a project could not be evaluated"; exit 1
          fi
          # Positive marker: at least one project must have been reported on (clean line or a findings table).
          if ! grep -qE "has no vulnerable packages|Severity" audit.txt; then
            echo "::error::no per-project result in the output: the check did not run"; exit 1
          fi
          if grep -qE "\b(High|Critical)\b" audit.txt; then
            echo "::error::High or Critical vulnerable package found"; exit 1
          fi

  dependency-review:
    name: dependency review (pull requests)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      # Needs the dependency graph, which is free for public repositories and part of GitHub Advanced Security
      # for private ones. If this step errors with "Dependency review is not supported", enable the graph or drop the job.
      - uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019  # v4.5.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  # There is no API Dockerfile yet (no deployable image exists). This scans what the repo does ship or run:
  # the Postgres image used by compose (fails on fixable HIGH/CRITICAL), the dotnet SDK dev-tooling image
  # (report only: it is never deployed) and the repo's config files (compose, workflows) for misconfiguration.
  #
  # SBR-01 (cache half). A third-party action always receives the runtime cache token and could write ANY cache key.
  # Caches written on `main` are readable by every PR and by the nuget/playwright restores in api, e2e-harness and
  # e2e-real; caches written by a pull_request run are visible only to that PR. So this job:
  #   - runs on pull_request only (never on push to main, and it has no schedule), so a compromised scan action can
  #     only write PR-scoped caches that no main-branch job restores;
  #   - restores no cache itself and turns the action's own Trivy DB cache off (`cache: false`);
  #   - has no checkout credentials and only `contents: read`.
  # Cost: no automatic scan of main after merge; the base images are only scanned when a code PR runs. Residual: the
  # token exposure itself is unchanged until the action is replaced by a checksum-pinned binary (run: steps do not
  # receive the runtime token); that is a follow-up, not done here.
  image-scan:
    name: container and config scan (Trivy)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Trivy image scan, postgres:16.15-alpine (gate; gosu ignores in .trivyignore.yaml expire 2026-12-01)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          cache: false
          scan-type: image
          image-ref: postgres:16.15-alpine
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy image scan, dotnet SDK dev image (report only)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          cache: false
          scan-type: image
          image-ref: mcr.microsoft.com/dotnet/sdk:10.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Trivy config scan (compose and workflows)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          cache: false
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  # One stable check name for branch protection (SEC-040, not configured yet). Matrix shard names and skipped jobs
  # change with the diff; this job always runs and fails if any needed job failed or was cancelled. Skipped counts as
  # success, same as for a required check on a docs-only change.
  ci-result:
    name: ci result (all required jobs)
    if: ${{ always() }}
    needs: [changes, web, api, e2e-harness, e2e-real, secret-scan, dependency-audit, dependency-review, image-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
