name: CodeQL
# First run 2026-11-01 (run 41313272589): analysis itself completed, but BOTH jobs failed at the SARIF upload with
# "Code scanning is not enabled for this repository". The repo is PRIVATE; code scanning on a private repo needs GitHub
# Code Security / Advanced Security (paid) -- a licensing/settings matter, not fixable in YAML. Product Owner decision
# needed: (a) make the repo public (free), (b) buy GHAS, or (c) keep CodeQL out of required checks and switch the
# analyze step to `upload: never` + upload the SARIF as a workflow artifact. Until then this workflow will stay red.
# Separate real defect fixed here: C# build-mode none printed 16 "dotnet restore --no-dependencies ... failed with
# exit code 1" errors (CodeQL 2.20.2 bundled with v3.28.3 predates .NET 10; its buildless restore fakes the targeting
# pack root). C# now uses a real build (manual) with the repo SDK and a newer pinned action. UNVERIFIED until a new run.
# Docs-only pull requests/pushes are skipped via paths-ignore; the weekly schedule always runs. Because paths-ignore
# means no check is reported for docs-only changes, do NOT make a CodeQL check "required" in branch protection
# until this is revisited (a required check that never reports blocks the merge).
on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", ".claude/**"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", ".claude/**"]
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write   # upload SARIF
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual        # real `dotnet build` under the tracer (buildless restore breaks on net10 with the old bundle)
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        if: matrix.language == 'csharp'
        with:
          global-json-file: src/api/global.json   # 10.0.403, rollForward latestFeature
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.38.3 (commit SHA resolved via gh api 2026-11-01, tag dated 2026-10-08)
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build C# (traced by CodeQL)
        if: matrix.language == 'csharp'
        run: dotnet build src/api/Tether.slnx -c Release -p:UseSharedCompilation=false
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.38.3 (commit SHA resolved via gh api 2026-11-01, tag dated 2026-10-08)
        with:
          category: "/language:${{ matrix.language }}"
