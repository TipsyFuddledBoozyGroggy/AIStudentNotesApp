# Trivy ignore list, time-boxed. Created 2026-11-01 by devops-engineer. Read docs/ops/ci-matrix.md ("Trivy and the postgres image").
#
# What: 26 fixable HIGH/CRITICAL findings, all in the Go stdlib (go1.24.6) of /usr/local/bin/gosu (gosu 1.19),
# which the official postgres image ships. Verified 2026-11-01 with Trivy 0.69.3: every postgres 16 tag
# (16, 16.15, 16-alpine, 16.15-alpine, 16.15-alpine3.23/3.24, 16-bookworm, 16.15-bookworm) has the same 26; the OS
# packages are clean. There is no clean tag to move to.
# Why accepted: gosu runs once at container start to drop root to the postgres user, then exec()s postgres. It is not a
# server and opens no network listeners, so the net/http, crypto/tls, net/url, html/template, mime and xml DoS and
# parsing issues are not reachable from outside. Our use is a dev/CI database on localhost or a throwaway runner.
# Scope: only the gosu binary path, so any new finding elsewhere in the image still fails the gate.
# Expiry: 2026-12-01. After that the entries stop applying and the gate fails again, on purpose. Before then re-run
# the scan against the newest postgres:16 tag; if upstream rebuilt gosu with Go >= 1.25.13, delete this file.
# NOT acceptable for a deployed database: a production database uses the cloud provider's managed Postgres, not this image.
vulnerabilities:
  - id: CVE-2025-61726
    paths:
      - "usr/local/bin/gosu"
    statement: "gosu go1.24.6 stdlib; not network-facing; see header"
    expired_at: 2026-12-01
