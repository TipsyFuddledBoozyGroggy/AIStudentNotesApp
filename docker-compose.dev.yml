# Dev-only tooling container: runs dotnet CLI against src/api without a host SDK.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm dotnet dotnet test src/api
services:
  dotnet:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /repo
    volumes:
      - .:/repo
      - nuget-cache:/root/.nuget/packages
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-college_companion_dev};Username=${POSTGRES_USER:-cc_dev};Password=${POSTGRES_PASSWORD:-cc_dev_only_password}"
    depends_on:
      postgres:
        condition: service_healthy
  # Runs the API for local web development (Development env => dev login enabled).
  # Reachable only from this machine. Start: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d api
  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /repo
    command: dotnet run --project src/api/src/Tether.Host --urls http://0.0.0.0:5080
    ports:
      - "127.0.0.1:5080:5080"
    volumes:
      - .:/repo
      - nuget-cache:/root/.nuget/packages
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      ASPNETCORE_ENVIRONMENT: Development
      Security__AllowedOrigins__0: "http://localhost:3000"
      # Dev only: lets repeat E2E runs sign in without waiting out the 10/min login limit.
      RateLimiting__AuthPermitPerMinute: "1000"
      # Dev only: the serial real-stack E2E starts many lectures per minute (the defaults of 6 audio tickets, 30 writes and 120 requests per minute per user otherwise 429 it).
      RateLimiting__AudioTicketPermitPerMinute: "600"
      RateLimiting__WritePermitPerMinute: "300"
      RateLimiting__ApiPermitPerMinute: "1200"
      # Dev only (item 3, docs.export.v1): the Demo Doc routes have their own buckets (10 confirms and 60 reads per minute by default); the serial E2E needs more.
      RateLimiting__DocsWritePermitPerMinute: "120"
      RateLimiting__DocsReadPermitPerMinute: "600"
      # Dev only (item 3, DXD-07): lets the E2E force a Demo Doc provider failure with the X-Demo-Docs-Fault request header. The Docs module refuses to start
      # with ANY Docs:Demo:Faults:* key outside Development and Test, so this line must never reach a shared or production compose file.
      Docs__Demo__Faults__Enabled: "true"
      # Dev only (PO-20ah): the live-session join limits keep their production defaults (10 and 30 per minute) in code.
      Realtime__JoinPermitPerMinute: "300"
      Realtime__JoinPermitPerUserPerMinute: "600"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-college_companion_dev};Username=${POSTGRES_USER:-cc_dev};Password=${POSTGRES_PASSWORD:-cc_dev_only_password}"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  nuget-cache:
